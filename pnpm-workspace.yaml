allowBuilds:
  core-js-pure: true
  dtrace-provider: true
  re2: true
  # protobufjs@7.6.6 (via renovate 44.x) ships compiled JS. Its postinstall is
  # not needed for renovate-config-validator; deny it so pnpm 11 does not fail
  # with ERR_PNPM_IGNORED_BUILDS (#1881).
  protobufjs: false

# Transitive packages whose parents still pin vulnerable ranges. Selectors keep
# each major line on a compatible patched release.
overrides:
  # node-gyp (via re2) still resolves undici 8.9.0; High issues are fixed in >=8.12.4.
  undici: 8.13.1
  # bunyan > mv > rimraf > glob@6 still resolves minimatch 3.1.2 (High ReDoS).
  minimatch@3: 3.1.5
  braces: 3.0.3
  picomatch@2: 2.3.2
  picomatch@4: 4.0.7
  brace-expansion@1: 1.1.22
  brace-expansion@5: 5.1.0
  js-yaml@4: 4.3.2
  # GHSA-869p-cjfg-cm3x is patched in 4.0.1; npm audit still lists patched=None.
  jws: 4.0.1
  # renovate 44.257.9 still pulls simple-git 4.0.2 (CVE-2026-134815 / GHSA-24pq-g7mp-w876).
  simple-git: 4.1.0
  # glob 13.0.7 backports the AbortSignal walk-after-abort fix (GHSA-3g3m-2fjr-6pw4).
  glob@13: 13.0.7
